version: 1
builds:
  image:
    build_args:
      FRAPPE_BRANCH: version-16
      NODE_VERSION: 24.13.0
      PYTHON_VERSION: 3.14.2
    context: frappe_docker
    dockerfile: frappe_docker/images/custom/Containerfile
    kind: docker
    platforms:
      - linux/amd64
    secrets:
      apps_json: apps.json
scribe:
  files:
    readme.contents.apps:
      between:
        - <!-- sf:contents-apps:start -->
        - <!-- sf:contents-apps:end -->
      file: README.md
      items:
        - contents-apps
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/scribe-docker.yml
lint:
  modules:
    freshness:
      exclude:
        - frappe_docker/images/bench/**
    vulnerabilities:
      exclude:
        - frappe_docker/docs/**
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/lint-generic.yml
security:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/security.yml
dependency:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/dependency.yml
commit:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/commit.yml
release:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/release.yml
manifest:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/manifest.yml
build_cache:
  mode: local
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/build_cache.yml
ci:
  forge:
    - gitlab
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
forges:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/forges.yml
git:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/git.yml
  submodules: true
metadata:
  category: applications
  description:
    - ERPNext with HR, CRM, and helpdesk, built as one container image.
    - Frappe bench image bundling ERPNext, HRMS, CRM, telephony, and helpdesk.
  license: GPL-3.0
  org: HomeLabHD
  title: Frappe Bench
  topics:
    - erpnext
    - frappe
    - erp
    - hrms
    - helpdesk
    - docker
orgs:
  HomeLabHD:
    aliases:
      docker: hlhd
      ghcr: homelabhd
      github: HomeLabHD
      handle: hlhd
    maintainer: HomeLabHD <homelabhelp@gmail.com>
publish:
  dev:
    tags:
      - dev-{sha:8}
      - latest-dev
      - latest-v16-dev
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/publish-docker.yml
  stable:
    tags:
      - v{version}
      - latest
      - latest-v16
registries:
  preset: https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/registries.yml
repos:
  github-mirror:
    forge: github
    project: HomeLabHD/frappe-suite
    roles:
      - mirror
      - publish-origin
    sync:
      git: true
      releases: true
  primary:
    branches:
      default: main
    forge: gitlab
    project: HomeLabHD/frappe-suite
    roles:
      - primary
    worktree: .
stencils:
  contents-apps:
    build: image
    include:
      - frappe
      - erpnext
      - hrms
      - crm
      - helpdesk
      - telephony
    render: badges
    section: detected.pip
    type: contents
  presets:
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-base.yml
    - https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy//preset/stencils-status.yml
